syntax = "proto3";

package gcp.v1;

// Project represents a GCP Project resource.
message Project {
  string project_id = 1;
  string display_name = 2;
}

// CloudRunService represents a Cloud Run service.
message CloudRunService {
  string name = 1;
  string region = 2;
}
