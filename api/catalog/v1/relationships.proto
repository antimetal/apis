syntax = "proto3";

package catalog.v1;

// Contains represents hierarchical containment.
// Valid paths: Domain->System, System->Component, System->Resource, Component->Resource
//              Resource->Component, Resource->System, Resource->Domain
message Contains {}

// ContainedBy represents hierarchical ownership.
// Inverse of Contains
message ContainedBy {}

// Exposes represents API exposure.
// Valid paths: System->API
message Exposes {}

// ExposedBy represents which systems exposes the API.
// Inverse of Exposes
// Valid paths: API -> System
message ExposedBy {}

// ImplementedBy represents API implementation.
// Inverse of Exposes
// Valid path: API->Component
message ImplementedBy {}

// Implements represents a component implementing an API
// Inverse of ImplementedBy
// Valid path: Component -> API
message Implements {}

// Consumes represents API or service consumption.
// Valid paths: Component->API, Component->Component
message Consumes {}

// ConsumedBy represents which APIs or Services are consuming it
// Inverse of Consumes
message ConsumedBy {}

// Underlying represents infrastructure attachment.
// Valid paths: Component->Resource
message Underlying {}

// Underlies represents an infrastructure resource supporting a catalog
// entity (Component, API, etc.)
// Inverse of Underlying
// Valid paths: Resource -> Component
message Underlies {}

// SourcedFrom represents source code origin.
// Components, Systems, and APIs reference the repositories that contain their source code.
// Valid paths: Component->Repository, System->Repository, API->Repository
message SourcedFrom {}

// Sources represents a repository providing source code for a catalog entity.
// Inverse of SourcedFrom
// Valid paths: Repository->Component, Repository->System, Repository->API
message Sources {}
